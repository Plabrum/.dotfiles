gui:
  nerdFontsVersion: "3"
git:
  branchPrefix: pal/
os:
  # editPreset sets lazygit's "don't run this in a terminal" flag, which is what
  # kills the "press ENTER to return to lazygit" prompt. The explicit edit/
  # editAtLine below then override the preset's commands: they close the snacks
  # lazygit float (--remote-send "q") and open the file with --remote (a buffer
  # in the window you were in) instead of the preset's --remote-tab (a new tab).
  editPreset: nvim-remote
  edit: 'nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}}'
  editAtLine: 'nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>"'

customCommands:
  - key: "e"
    description: "Graphite"
    commandMenu:
      - key: "s"
        context: "localBranches"
        description: "Submit Stack"
        command: "gt submit --stack"
        output: log
        #   context: "localBranches"
        #   description: "Submit PR"
        #   command: "gt submit {{.SelectedLocalBranch.Name}}"
        # - key: "S"
      - key: "m"
        context: localBranches
        description: "Modify branch"
        command: "gt modify {{.SelectedLocalBranch.Name}}"
        output: log

      - key: "c"
        context: localBranches
        description: "Continue (after modifiactio)"
        command: "gt continue"
        output: log

      - key: "r"
        context: "localBranches"
        description: "Restack"
        command: "gt restack"

      - key: "c"
        context: "localBranches"
        description: "Create branch"
        prompts:
          - type: "input"
            title: "What is the new branch name?"
            key: "BranchName"
            initialValue: "pal/"
        command: "gt create {{.Form.BranchName}}"
        output: log

      - key: "t"
        context: "localBranches"
        command: "gt tr"
        description: "Track current branch"
        output: log
